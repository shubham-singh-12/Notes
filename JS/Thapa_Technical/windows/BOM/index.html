<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM (Browser Object Model)</title>
</head>

<body>

    <!-- ================== JS window Object ================== -->
    <!-- window.alert() -->
    <button onclick="alertMessage()">Click Me</button>





    <!-- ================= JS History Object ================= -->
    <!-- 1. Go Back -->
    <button onclick="goBack()">Go back</button>

    <!-- 2. Go Forward -->
    <button onclick="goForward()">Go Forward</button>

    <!-- 3. Move Backward or Forward -->
    <button onclick="moveBackForward()">Move Backward or Forward</button>

    <!-- And many more functions / Methods available -->





    <!-- ================= JS Location Object ================= -->
    <!-- 1. Reload the Page -->
    <button onclick="reloadPage()">Reload the Page</button>

    <!-- 2. Navigate Page using replace -->
    <button onclick="navigatePageReplace()">Navigate Page using Replace</button>

    <!-- 3. Navigate Page with Assign -->
    <button onclick="navigatePageAssign()">Navigate Page with Assign</button>

    <!-- And many more functions / methods available -->





    <!-- ================== JS Screen Object ================== -->
    <!-- 1. Screen Width & Height -->
    <!-- 2. Screen Available Width & Height -->
    <!-- 3. Screen Color Depth -->
    <!-- 4. Screen Orientation -->
    <!-- 5. Screen Pixel Depth -->





    <!-- ====================================================== -->
    <!-- INTERNAL JS FILE -->
    <script src="./script.js"></script>
</body>

</html>
